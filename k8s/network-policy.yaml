apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-order-service
  namespace: ecommerce
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 80